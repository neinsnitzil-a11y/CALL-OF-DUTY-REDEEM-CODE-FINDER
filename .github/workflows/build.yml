# Builds and tests on every push; on Windows it also produces the installer as a downloadable artifact.
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DHUNTER_BUILD_APP=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          $out = "dist/CODRedemptionHunter"
          New-Item -ItemType Directory -Force "$out/data" | Out-Null
          Copy-Item build/CODRedemptionHunter.exe $out
          Copy-Item data/config.json, data/.env.example, data/meta.json, data/research_sources.json "$out/data"
          New-Item -ItemType Directory -Force "$out/data/i18n" | Out-Null
          Copy-Item data/i18n/*.json "$out/data/i18n"
          Copy-Item README.md, LICENSE $out
          windeployqt --release --no-translations --no-compiler-runtime --no-opengl-sw "$out/CODRedemptionHunter.exe"
          Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | ForEach-Object { Copy-Item "$($_.FullName)/*.dll" $out }
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(CODRedemptionHunter VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$ver" packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Redemption-Hunter-Windows
          path: dist/installer/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: ./build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Redemption-Hunter-Android
          path: dist/*.apk
